name: Send workouts to Garmin

# Started by the MatRob Running Generator app, and once a day on its own to
# keep the next 7 days of workouts on your watch. You can also run it from
# the Actions tab (mode "login" just tests your Garmin login).
on:
  schedule:
    - cron: "23 18 * * *"   # every day: send the next 7 days' workouts to your watch
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (set by the app)"
        required: false
        type: string
      mode:
        description: "send, login, push_week, clean_sent or clean_all"
        required: false
        default: send
        type: string
      mfa_code:
        description: "Garmin verification code (only if asked for one)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: garmin-send
  cancel-in-progress: false

jobs:
  send:
    # never run in the shared public template, only in each user's private copy
    if: github.repository != 'matrobinson1993/matrob-garmin-sender'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore saved Garmin login
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.garminconnect
            ~/.garmin-pending
          key: garmin-login-${{ github.run_id }}
          restore-keys: garmin-login-

      - name: Send to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          JOB: ${{ inputs.job }}
          MODE: ${{ github.event_name == 'schedule' && 'push_week' || inputs.mode }}
          MFA_CODE: ${{ inputs.mfa_code }}
        run: python send_workouts.py

      - name: Keep Garmin login for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.garminconnect
            ~/.garmin-pending
          key: garmin-login-${{ github.run_id }}

      - name: Save results for the app
        if: always()
        run: |
          git config user.name "MatRob Garmin Sender"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox results state
          if ! git diff --cached --quiet; then
            git commit -q -m "Workout send results"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
          fi
